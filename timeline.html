<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title></title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <script type="module" src="./timeline-page.js"></script>
  </head>
  <body oncontextmenu="return false;">
    <div id="wapper" class="wapper">
        <svg xmlns="http://www.w3.org/2000/svg" id="period" class="period" width="100%" height="100%"></svg>
        <svg xmlns="http://www.w3.org/2000/svg" id="events" class="events" width="100%" height="100%"></svg>
      <svg xmlns="http://www.w3.org/2000/svg" id="content" class="content" width="100%" height="100%">
        <defs>
          <linearGradient id="gradL" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:transparent"/>
            <stop offset="100%" style="stop-color:black"/>
          </linearGradient>
          <linearGradient id="gradR" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:black"/>
            <stop offset="100%" style="stop-color:transparent"/>
          </linearGradient>
          <linearGradient id="gradT" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:transparent"/>
            <stop offset="100%" style="stop-color:black"/>
          </linearGradient>
          <linearGradient id="gradB" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" style="stop-color:transparent"/>
            <stop offset="100%" style="stop-color:black"/>
          </linearGradient>
          <linearGradient id="gradLR" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:transparent"/>
            <stop offset="50%" style="stop-color:black"/>
            <stop offset="100%" style="stop-color:transparent"/>
          </linearGradient>
          <linearGradient id="gradTB" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:transparent"/>
            <stop offset="50%" style="stop-color:black"/>
            <stop offset="100%" style="stop-color:transparent"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <aside class="timeline-tools" aria-label="时间线工具" hidden>
      <button id="timeline-tool-drag" class="timeline-tools__drag" type="button" aria-label="拖动工具栏" title="拖动工具栏">
        <svg viewBox="0 0 12 20" aria-hidden="true">
          <circle cx="3" cy="5" r="1"/><circle cx="9" cy="5" r="1"/>
          <circle cx="3" cy="10" r="1"/><circle cx="9" cy="10" r="1"/>
          <circle cx="3" cy="15" r="1"/><circle cx="9" cy="15" r="1"/>
        </svg>
      </button>
      <div class="timeline-tools__group" aria-label="缩放控制">
        <button id="zoom-out" type="button" aria-label="缩小时间线" title="缩小" disabled>−</button>
        <button id="zoom-reset" type="button" aria-label="恢复默认缩放" title="恢复 100%" disabled>
          <output id="zoom-value" aria-live="polite">100%</output>
        </button>
        <button id="zoom-in" type="button" aria-label="放大时间线" title="放大" disabled>+</button>
      </div>
      <button id="timeline-layout" class="timeline-tools__layout" type="button" aria-label="切换为纵向时间线" title="切换为纵向" aria-pressed="false" disabled>
        <span id="layout-value" aria-hidden="true">横</span>
      </button>
      <button id="timeline-save" class="timeline-tools__save" type="button" aria-label="导出图片" title="导出图片" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 17v3h14v-3"/>
        </svg>
        <span>导出</span>
      </button>
      <p id="timeline-tool-status" class="timeline-tools__status" role="status" aria-live="polite"></p>
    </aside>
  </body>
</html>
