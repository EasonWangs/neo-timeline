<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title></title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="./vendor/json5.min.js"></script>
    <script src="./utils.js" type="text/javascript" charset="utf-8"></script>
    <script src="./vendor/snap.svg-min.js" type="text/javascript" charset="utf-8"></script>
    <script src="./timeline.js" type="text/javascript" charset="utf-8"></script>
    <link href="./timeline.css" rel="stylesheet">
     <script type="text/javascript">
      const PageUtils = window.TimelineUtils;
      const pars = PageUtils.getParams();
      document.title = pars.title || "时间线";

      function showLoadError(message) {
        const wrapper = $id("wapper");
        if (!wrapper) return;
        wrapper.textContent = "";
        const node = document.createElement("div");
        node.style.cssText = "max-width:720px;margin:48px auto;padding:24px;color:#8a1f11;background:#fff8f2;border:1px solid #e2b8a7;font-family:sans-serif;line-height:1.7;white-space:pre-line;";
        node.textContent = message;
        wrapper.appendChild(node);
      }

      window.onload = function() {
        const url = "./data/" + pars.name + ".json5";
        if (!pars.name) {
          showLoadError("缺少 name 参数，请从 index.html 进入。");
          return;
        }
        if (location.protocol == "file:") {
          showLoadError("数据加载失败：" + url + "\n当前页面是通过 file:// 直接打开的，浏览器会阻止读取本地 JSON5 数据文件。\n请在项目目录运行：npm run dev\n然后访问：http://127.0.0.1:5173/index.html");
          return;
        }
        fetch(url).then(function(response) {
          if (!response.ok) {
            throw new Error("HTTP " + response.status + " when loading " + url);
          }
          return response.text();
        }).then(function(text) {
          const data = JSON5.parse(text);
          Cfg = PageUtils.normalizeConfig(data.config);
          drawList(data);
          resize();
          initDragPan();

          if (Cfg.layout == "v") {
            $id('wapper').className = "wapper vertical";
          }
        }).catch(function(err) {
          console.error("Failed to load timeline data:", err);
          showLoadError("数据加载失败：" + url + "\n错误信息：" + err.message + "\n请确认文件存在、格式正确，并通过本地服务器访问页面。");
        });
      };
      window.onscroll = function() {
        if (!window.Cfg) return;
        const sh = -Math.max(document.body.scrollLeft, document.documentElement.scrollLeft);
        const sv = -Math.max(document.body.scrollTop, document.documentElement.scrollTop);
        if($id('ruler-v')) $id('ruler-v').style.top = sv + 'px' 
        if($id('ruler-h'))  $id('ruler-h').style.left = sh + 'px' 
        if(Cfg.layout == "h"){
          if(Cfg.p.position != "absolute") if($id('period')) $id('period').style.left = sh + 'px' 
          if($id('events')) $id('events').style.left = sh + 'px' 
        }else{
          if(Cfg.p.position != "absolute") if($id('period')) $id('period').style.top = sv + 'px' 
          if($id('events')) $id('events').style.top = sv + 'px' 
        }
      }
    </script>
  </head>
  <body oncontextmenu="return false;">
    <div id="wapper" class="wapper">
        <svg xmlns="http://www.w3.org/2000/svg" id="period" class="period" width="100%" height="100%"></svg>
        <svg xmlns="http://www.w3.org/2000/svg" id="events" class="events" width="100%" height="100%"></svg>
      <svg xmlns="http://www.w3.org/2000/svg" id="content" class="content" width="100%" height="100%">
        <defs>
          <linearGradient id="gradL" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:transparent"/>
            <stop offset="100%" style="stop-color:black"/>
          </linearGradient>
          <linearGradient id="gradR" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:black"/>
            <stop offset="100%" style="stop-color:transparent"/>
          </linearGradient>
          <linearGradient id="gradT" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:transparent"/>
            <stop offset="100%" style="stop-color:black"/>
          </linearGradient>
          <linearGradient id="gradB" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" style="stop-color:transparent"/>
            <stop offset="100%" style="stop-color:black"/>
          </linearGradient>
          <linearGradient id="gradLR" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:transparent"/>
            <stop offset="50%" style="stop-color:black"/>
            <stop offset="100%" style="stop-color:transparent"/>
          </linearGradient>
          <linearGradient id="gradTB" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:transparent"/>
            <stop offset="50%" style="stop-color:black"/>
            <stop offset="100%" style="stop-color:transparent"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
  </body>
</html>
